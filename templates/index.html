<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bharat Estate AI | Pro Valuator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #6366f1; --bg: #030712; --card: #0f172a; }
        body { margin:0; font-family:'Outfit', sans-serif; background:var(--bg); color:white; display:flex; height:100vh; overflow:hidden; }
        
        .sidebar { width: 450px; background:var(--card); border-right: 1px solid #1e293b; padding:30px; overflow-y:auto; z-index:1000; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .header { font-size: 24px; font-weight: 900; color: var(--accent); margin-bottom: 25px; display:flex; align-items:center; gap:10px; }
        
        .section-label { font-size:10px; text-transform:uppercase; color:var(--accent); letter-spacing:2px; margin: 25px 0 12px; font-weight:900; display:block; border-bottom:1px solid #1e293b; padding-bottom:5px; }
        
        .input-row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:10px; }
        .field-box { display: flex; flex-direction: column; }
        .field-box label { font-size: 11px; color: #94a3b8; margin-bottom: 5px; }

        input, select { width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:white; box-sizing:border-box; outline:none; font-size:14px; transition: 0.2s; }
        input:focus { border-color: var(--accent); }
        
        .checkbox-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; font-size:12px; color:#94a3b8; margin-top:10px; }
        .check-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }

        .btn-predict { width:100%; padding:16px; background:linear-gradient(135deg, var(--accent), #8b5cf6); border:none; border-radius:12px; color:white; font-weight:800; cursor:pointer; text-transform:uppercase; margin-top:25px; }
        
        #map { flex-grow:1; z-index:1; }
        #result { margin-top:20px; padding:20px; background:rgba(99,102,241,0.1); border-radius:15px; border:1px solid var(--accent); display:none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header"><i class="fas fa-microchip"></i> BHARAT ESTATE AI</div>
        
        <div class="field-box" style="margin-bottom:20px;">
            <label>LOCATE PROPERTY</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="citySearch" placeholder="Search City/Area...">
                <button onclick="search()" style="background:var(--accent); border:none; color:white; padding:10px 15px; border-radius:8px; cursor:pointer;"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <form id="proForm">
            <span class="section-label">Section 2 — Property</span>
            <div class="input-row">
                <div class="field-box"><label>AREA (SQ FT)</label><input type="number" name="sqft" value="1200"></div>
                <div class="field-box"><label>CONFIG</label><select name="bhk"><option value="2">2 BHK</option><option value="3">3 BHK</option><option value="4">4+ BHK</option></select></div>
            </div>
            <div class="input-row">
                <div class="field-box"><label>AGE (YRS)</label><input type="number" name="age" value="5"></div>
                <div class="field-box"><label>FLOOR NO</label><input type="number" name="floor" value="1"></div>
            </div>

            <span class="section-label">Section 3 — Accessibility</span>
            <div class="input-row">
                <div class="field-box"><label>MAIN ROAD (KM)</label><input type="number" step="0.1" name="dist_road" placeholder="e.g. 0.5"></div>
                <div class="field-box"><label>METRO/NH (KM)</label><input type="number" step="0.1" name="dist_metro" placeholder="e.g. 2.0"></div>
            </div>
            <div class="field-box"><label>ROAD WIDTH (FT)</label><input type="number" name="road_width" value="30"></div>

            <span class="section-label">Section 4 — Amenities</span>
            <div class="checkbox-grid">
                <label class="check-item"><input type="checkbox" name="amenities"> Pool/Gym</label>
                <label class="check-item"><input type="checkbox" name="gated"> Gated Society</label>
                <label class="check-item"><input type="checkbox" name="main_road_touch"> Road Touch</label>
                <label class="check-item"><input type="checkbox" name="lift"> Lift Available</label>
            </div>

            <input type="hidden" id="lat" name="lat"><input type="hidden" id="lng" name="lng">
            <button type="submit" class="btn-predict">Analyze Valuation</button>
        </form>

        <div id="result">
            <div id="resPrice" style="font-size:32px; font-weight:900; color:#10b981;"></div>
            <div id="resRate" style="font-size:13px; opacity:0.7; margin-top:5px;"></div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([23.18, 79.98], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        var marker;

        function search() {
            var q = document.getElementById('citySearch').value;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=in&limit=1`).then(r => r.json())
            .then(d => { if(d.length > 0) { map.flyTo([d[0].lat, d[0].lon], 15); placeMarker(d[0].lat, d[0].lon); } });
        }

        function placeMarker(lat, lng) {
            if(marker) map.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable:true}).addTo(map);
            document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
        }
        map.on('click', function(e) { placeMarker(e.latlng.lat, e.latlng.lng); });

        document.getElementById('proForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!document.getElementById('lat').value) return alert("📍 Pin location on map!");
            const resDiv = document.getElementById('result');
            resDiv.style.display = "block";
            resDiv.innerHTML = "<div style='color:var(--accent); font-weight:700;'><i class='fas fa-spinner fa-spin'></i> Analyzing Trends...</div>";
            
            try {
                const response = await fetch('/predict', { method: 'POST', body: new FormData(e.target) });
                const data = await response.json();
                resDiv.innerHTML = `<div id="resPrice" style="font-size:32px; font-weight:900; color:#10b981;">${data.price}</div>
                                    <div style="font-size:13px; opacity:0.7;">Avg Rate: ${data.rate}</div>`;
            } catch (err) {
                resDiv.innerHTML = "<div style='color:#f87171;'>Server Error. Try again.</div>";
            }
        };
    </script>
</body>
</html>
