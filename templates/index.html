<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Estate AI Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --panel: #0d1117; --accent: #3b82f6; --success: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e6edf3; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 420px; background: var(--panel); border-right: 1px solid #30363d; padding: 30px; display: flex; flex-direction: column; z-index: 1000; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
        .logo-box { width: 40px; height: 40px; background: var(--accent); border-radius: 8px; display: grid; place-items: center; font-size: 20px; }
        
        .form-group { margin-bottom: 20px; }
        label { font-size: 11px; text-transform: uppercase; color: #8b949e; letter-spacing: 1px; display: block; margin-bottom: 8px; }
        input, select { width: 100%; background: #161b22; border: 1px solid #30363d; padding: 12px; color: white; border-radius: 6px; box-sizing: border-box; }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-main:hover { background: #2563eb; }

        #res-box { margin-top: 30px; padding: 25px; border-radius: 8px; border: 1px dashed #30363d; display: none; background: rgba(59,130,246,0.05); }
        .price-val { font-size: 36px; font-weight: 800; color: var(--success); }
        #map { flex-grow: 1; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header"><div class="logo-box">AI</div> <h2 style="margin:0">Bharat Estate</h2></div>
    
    <div class="form-group"><label>Area (Sq Ft)</label><input type="number" id="sqft" value="1200"></div>
    <div style="display:flex; gap:15px">
        <div class="form-group" style="flex:1"><label>Beds</label><input type="number" id="beds" value="2"></div>
        <div class="form-group" style="flex:1"><label>Baths</label><input type="number" id="baths" value="2"></div>
    </div>
    <div class="form-group">
        <label>Property Class</label>
        <select id="prop_type"><option value="0">Apartment</option><option value="1">House</option><option value="2">Villa</option></select>
    </div>

    <button class="btn-main" onclick="getPrediction()"><i class="fa-solid fa-bolt"></i> ANALYZE LOCATION</button>

    <div id="res-box">
        <div id="res-city" style="color:var(--accent); font-weight:700; margin-bottom:5px;"></div>
        <div class="price-val" id="res-price"></div>
        <div id="res-rate" style="opacity:0.6; font-size:14px;"></div>
        <div id="res-label" style="margin-top:15px; font-size:12px; color:#f0883e; background:rgba(240,136,62,0.1); padding:8px; border-radius:4px;"></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([23.18, 79.98], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    var marker = L.marker([23.18, 79.98], {draggable:true}).addTo(map);

    async function getPrediction() {
        const btn = document.querySelector('.btn-main');
        btn.innerHTML = "CALCULATING...";
        const pos = marker.getLatLng();
        
        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sqft: document.getElementById('sqft').value,
                    beds: document.getElementById('beds').value,
                    baths: document.getElementById('baths').value,
                    prop_type: document.getElementById('prop_type').value,
                    lat: pos.lat, lng: pos.lng
                })
            });
            const data = await response.json();
            document.getElementById('res-box').style.display = 'block';
            document.getElementById('res-price').innerText = data.price;
            document.getElementById('res-city').innerText = data.city;
            document.getElementById('res-rate').innerText = data.rate;
            document.getElementById('res-label').innerText = data.label;
        } catch (e) { alert("Server connection failed."); }
        finally { btn.innerHTML = '<i class="fa-solid fa-bolt"></i> ANALYZE LOCATION'; }
    }
</script>
</body>
</html>
