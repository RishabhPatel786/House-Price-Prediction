<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bharat Estate AI | Pro Valuator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #05070a; --card: #0f172a; }
        body { margin:0; font-family:'Outfit', sans-serif; background:var(--bg); color:white; display:flex; height:100vh; }
        .sidebar { width: 440px; background:var(--card); border-right: 1px solid #1e293b; padding:40px; overflow-y:auto; z-index:100; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
        .logo { font-size: 26px; font-weight: 900; color: var(--p); margin-bottom: 40px; }
        input, select { width:100%; padding:15px; margin-bottom:20px; border-radius:12px; border:1px solid #334155; background:#1e293b; color:white; box-sizing:border-box; outline:none; }
        .btn { width:100%; padding:18px; background:linear-gradient(135deg, var(--p), #8b5cf6); border:none; border-radius:12px; color:white; font-weight:800; cursor:pointer; }
        #map { flex-grow:1; }
        #resPanel { margin-top:30px; padding:20px; background:rgba(99,102,241,0.1); border:1px solid var(--p); border-radius:15px; display:none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">BHARAT ESTATE AI</div>
        <form id="pForm">
            <input type="text" id="sIn" placeholder="Search Locality..." style="background:#161e31; border-color:var(--p);">
            <button type="button" onclick="search()" class="btn" style="padding:10px; margin-bottom:25px;">Search</button>

            <label style="font-size:11px; color:#64748b;">TOTAL AREA (SQ FT)</label>
            <input type="number" name="sqft" value="1200">

            <label style="font-size:11px; color:#64748b;">DISTANCE FROM HIGHWAY / MAIN ROAD</label>
            <select name="distance">
                <option value="0">Road Touch / Frontage</option>
                <option value="1">Within 500 meters (5-15% lower)</option>
                <option value="2">500m to 1km (10-25% lower)</option>
                <option value="3">1km to 2km (20-40% lower)</option>
                <option value="4">2km to 5km (40-70% lower)</option>
            </select>

            <input type="hidden" id="lat" name="lat">
            <input type="hidden" id="lng" name="lng">
            <button type="submit" class="btn">ANALYZE MARKET VALUE</button>
        </form>
        <div id="resPanel">
            <div id="resCity" style="color:var(--p); font-weight:700;"></div>
            <div id="resPrice" style="font-size:36px; font-weight:900; color:#10b981;"></div>
            <div id="resRate" style="font-size:14px; opacity:0.6;"></div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([23.18, 79.98], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        var marker;

        function search() {
            var q = document.getElementById('sIn').value;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=in&limit=1`).then(r => r.json())
            .then(d => { if(d.length > 0) { map.flyTo([d[0].lat, d[0].lon], 15); updateM(d[0].lat, d[0].lon); } });
        }

        function updateM(lat, lng) {
            if(marker) map.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable:true}).addTo(map);
            document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
        }

        map.on('click', function(e) { updateM(e.latlng.lat, e.latlng.lng); });

        document.getElementById('pForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/predict', { method: 'POST', body: new FormData(e.target) });
            const data = await res.json();
            document.getElementById('resPanel').style.display = 'block';
            document.getElementById('resPrice').innerText = data.price;
            document.getElementById('resCity').innerText = data.city;
            document.getElementById('resRate').innerText = "Rate: " + data.rate;
        };
    </script>
</body>
</html>
