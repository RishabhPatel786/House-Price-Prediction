<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Estate AI | Neural Property Intelligence</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <style>
    /* --- Futuristic UI Variables --- */
    :root {
      --bg-dark: #020617;
      --panel-glass: rgba(15, 23, 42, 0.65);
      --border-glow: rgba(59, 130, 246, 0.3);
      --neon-blue: #3b82f6;
      --neon-green: #10b981;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'JetBrains Mono', monospace; /* Professional tech-first typography */
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
    }

    /* Immersive Map Foundation */
    #map-container {
      position: absolute; inset: 0; z-index: 1;
      filter: grayscale(0.4) brightness(0.6) contrast(1.1);
    }
    #map { height: 100%; width: 100%; }

    /* Floating Glass Modules */
    .floating-hud {
      position: absolute; z-index: 10;
      backdrop-filter: blur(16px) saturate(180%);
      background: var(--panel-glass);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(59,130,246,0.05);
    }

    /* Header Module */
    .hub-header {
      top: 20px; left: 20px; right: 20px;
      height: 70px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 30px;
    }
    .brand { font-family: 'Syne'; font-weight: 800; font-size: 24px; letter-spacing: -1px; }
    .brand span { color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); }

    /* Control Intelligence Module */
    .control-module {
      top: 110px; left: 20px; bottom: 20px; width: 380px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Result Hub Module */
    .result-module {
      top: 110px; right: 20px; width: 400px;
      display: none; /* Hidden until prediction */
      animation: floatIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes floatIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    .module-title { font-size: 10px; font-weight: 800; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; }
    
    .input-field { margin-bottom: 15px; }
    label { font-size: 9px; color: var(--text-dim); display: block; margin-bottom: 8px; }
    input, select {
      width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glow);
      border-radius: 12px; color: white; font-family: inherit; font-size: 13px; outline: none;
    }
    input:focus { border-color: var(--neon-blue); box-shadow: 0 0 12px var(--border-glow); }

    .action-btn {
      width: 100%; padding: 18px; background: linear-gradient(135deg, var(--neon-blue), #1e40af);
      border: none; border-radius: 16px; color: white; font-weight: 800; font-size: 14px;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(59, 130, 246, 0.5); }

    .price-display { font-family: 'Syne'; font-size: 48px; font-weight: 800; color: var(--neon-green); text-shadow: 0 0 20px rgba(16, 185, 129, 0.4); margin: 10px 0; }
    .location-tag { font-size: 14px; color: var(--text-main); font-weight: 500; border-left: 2px solid var(--neon-blue); padding-left: 12px; }

    /* Custom Geocoder */
    .leaflet-control-geocoder { background: var(--panel-glass) !important; backdrop-filter: blur(10px) !important; border: 1px solid var(--border-glow) !important; border-radius: 14px !important; margin: 0 !important; width: 100% !important; }
    .leaflet-control-geocoder-form input { color: white !important; font-family: inherit !important; }

    /* Welcome Overlay */
    #overlay { position: fixed; inset: 0; background: var(--bg-dark); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
    .scanline { width: 300px; height: 1px; background: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); animation: scan 2s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-50px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(50px); opacity: 0; } }
  </style>
</head>
<body>

  <div id="overlay">
    <h1 style="font-family: 'Syne'; font-size: 32px; letter-spacing: 10px; text-transform: uppercase;">Initializing<span>_</span></h1>
    <div class="scanline"></div>
  </div>

  <header class="floating-hud hub-header">
    <div class="brand">BHARAT ESTATE <span>AI</span></div>
    <div style="display: flex; gap: 20px; font-size: 11px; color: var(--text-dim);">
      <span><i class="fa fa-signal"></i> NEURAL NETWORK ACTIVE</span>
      <span><i class="fa fa-database"></i> 2026 INDEX LOADED</span>
    </div>
  </header>

  <aside class="floating-hud control-module">
    <div class="module-title">Property Matrix</div>
    
    <div id="geocoder-anchor"></div> <form id="aiForm">
      <div class="input-field">
        <label>Spatial Volume (sq.ft)</label>
        <input type="number" name="sqft" id="sqft" value="1200" required>
      </div>
      
      <div style="display: flex; gap: 15px;">
        <div class="input-field" style="flex: 1;">
          <label>Units: Bed</label>
          <input type="number" name="beds" id="beds" value="2" required>
        </div>
        <div class="input-field" style="flex: 1;">
          <label>Units: Bath</label>
          <input type="number" name="baths" id="baths" value="2" required>
        </div>
      </div>

      <div class="input-field">
        <label>Structure Grade</label>
        <select name="prop_type">
          <option value="0">Urban Apartment</option>
          <option value="1">Modern Villa</option>
          <option value="2">Signature Estate</option>
        </select>
      </div>

      <div class="input-field">
        <label>Finishing Tier</label>
        <select name="furnish">
          <option value="0">Base Shell</option>
          <option value="1">Smart Semi</option>
          <option value="2">Elite Premium</option>
        </select>
      </div>

      <input type="hidden" name="lat" id="lat"><input type="hidden" name="lng" id="lng">
      <input type="hidden" name="manual_city" id="manual_city">
      
      <button type="submit" class="action-btn" id="runBtn">Compute Valuation</button>
    </form>
  </aside>

  <section id="result-hud" class="floating-hud result-module">
    <div class="module-title">Intelligence Report</div>
    <div id="res-val" class="price-display">₹0.00 L</div>
    <div id="res-loc" class="location-tag">---</div>
    <div id="res-tier" style="margin-top: 20px; font-size: 10px; color: var(--neon-blue); font-weight: 800;"></div>
    
    <div style="margin-top: 25px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px dashed var(--border-glow);">
      <p style="font-size: 10px; line-height: 1.6; color: var(--text-dim);">The valuation engine utilizes deep regression models cross-referenced with Indian real-time locality indices.</p>
    </div>
  </section>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script>
    // Initialize Dark Interactive Map
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([22.9734, 78.6569], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "SCAN LOCALITY...",
      collapsed: false,
      geocoder: L.Control.Geocoder.nominatim({ geocodingQueryParams: { countrycodes: 'in', addressdetails: 1, viewbox: '68,7,97,35', bounded: 1 } })
    }).on('markgeocode', function(e) {
      map.setView(e.geocode.center, 14);
      lockData(e.geocode.center, e.geocode.name);
    }).addTo(map);

    // Reparent geocoder to the sidebar module for cleaner UI
    document.getElementById('geocoder-anchor').appendChild(geocoder.getContainer());

    let marker;
    function lockData(latlng, name = "") {
      if (marker) map.removeLayer(marker);
      marker = L.circleMarker(latlng, { radius: 8, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8 }).addTo(map);
      document.getElementById('lat').value = latlng.lat;
      document.getElementById('lng').value = latlng.lng;
      document.getElementById('manual_city').value = name;
    }

    map.on('click', e => lockData(e.latlng));

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('overlay').style.display = 'none', 800);
      }, 1800);
    });

    document.getElementById('aiForm').onsubmit = async (e) => {
      e.preventDefault();
      if (!document.getElementById('lat').value) return alert("Spatial Coordinates Missing.");
      
      const btn = document.getElementById('runBtn');
      btn.innerText = "PROCESSING...";
      
      const res = await fetch('/predict', { method: 'POST', body: new FormData(e.target) });
      const data = await res.json();
      
      if (data.error) alert(data.error);
      else {
        const hud = document.getElementById('result-hud');
        hud.style.display = 'block';
        document.getElementById('res-val').innerText = data.price;
        document.getElementById('res-loc').innerText = data.city;
        document.getElementById('res-tier').innerText = data.tier_label;
      }
      btn.innerText = "Compute Valuation";
    };
  </script>
</body>
</html>
