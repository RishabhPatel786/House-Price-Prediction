<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Estate AI | Precision Property Intelligence</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bg: #030712; --glass: rgba(17, 24, 39, 0.75); --accent: #3b82f6; 
      --green: #10b981; --text: #f9fafb; --muted: #9ca3af; --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    /* AI Animated Background */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; filter: blur(80px);
      background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, #1e3a8a 0%, transparent 40%);
    }

    /* Welcome Feature */
    #welcome-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
    .loader-bar { width: 200px; height: 2px; background: #1f2937; margin-top: 20px; overflow: hidden; }
    .loader-progress { width: 0%; height: 100%; background: var(--accent); animation: load 1.5s ease-in-out forwards; }
    @keyframes load { to { width: 100%; } }

    header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: rgba(3, 7, 18, 0.4); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 100; }
    .logo { font-family: 'Syne'; font-weight: 800; font-size: 22px; }
    .nav-pill { display: flex; gap: 10px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 12px; }
    .nav-pill a { padding: 7px 18px; color: var(--muted); text-decoration: none; font-size: 13px; border-radius: 8px; font-weight: 500; }
    .nav-pill a.active { background: var(--accent); color: white; }

    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 420px; background: var(--glass); backdrop-filter: blur(25px); border-right: 1px solid var(--border); padding: 30px; overflow-y: auto; }
    
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    input, select { width: 100%; padding: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; }
    input:focus { border-color: var(--accent); }

    .btn-predict { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 14px; color: white; font-family: 'Syne'; font-weight: 800; cursor: pointer; }
    
    #result-section { display: none; margin-top: 30px; padding: 25px; background: rgba(16, 185, 129, 0.05); border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2); animation: slideUp 0.5s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .price-tag { font-family: 'Syne'; font-size: 38px; color: var(--green); font-weight: 800; margin: 10px 0; }

    .map-container { flex: 1; position: relative; }
    #map { height: 100%; width: 100%; }
    
    /* Search Bar Design */
    .leaflet-control-geocoder { background: var(--bg) !important; border-radius: 12px !important; border: 1px solid var(--border) !important; margin: 20px !important; }
    .leaflet-control-geocoder-form input { color: white !important; }
    #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 12px 25px; border-radius: 12px; display: none; z-index: 10000; font-weight: bold; }
  </style>
</head>
<body>

  <div id="welcome-screen">
    <h1 style="font-family: 'Syne'; font-size: 32px;">Bharat Estate <span style="color: var(--accent);">AI</span></h1>
    <div class="loader-bar"><div class="loader-progress"></div></div>
  </div>

  <header>
    <div class="logo">BHARAT ESTATE <span style="color: var(--accent);">AI</span></div>
    <div class="nav-pill">
      <a href="#" class="active">Predictor</a>
      <a href="#map">Market Map</a>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <form id="priceForm">
        <div class="input-group"><label>Total Area (sq. ft.)</label><input type="number" name="sqft" id="sqft" value="1200" required></div>
        <div style="display: flex; gap: 15px;">
          <div class="input-group" style="flex: 1;"><label>Beds</label><input type="number" name="beds" id="beds" value="2" required></div>
          <div class="input-group" style="flex: 1;"><label>Baths</label><input type="number" name="baths" id="baths" value="2" required></div>
        </div>
        <div class="input-group">
          <label>Property Class</label>
          <select name="prop_type">
            <option value="0">Apartment / Flat</option>
            <option value="1">Independent House</option>
            <option value="2">Luxury Villa</option>
          </select>
        </div>
        <div class="input-group">
          <label>Furnishing Status</label>
          <select name="furnish">
            <option value="0">Unfurnished</option>
            <option value="1">Semi-Furnished</option>
            <option value="2">Fully Furnished</option>
          </select>
        </div>
        <input type="hidden" name="lat" id="lat"><input type="hidden" name="lng" id="lng">
        <button type="submit" class="btn-predict" id="subBtn">RUN AI ANALYSIS</button>
      </form>

      <div id="result-section">
        <div class="price-tag" id="res-p">₹0.00 L</div>
        <div style="font-size: 14px; font-weight: bold;" id="res-city">---</div>
        <div id="res-tier" style="font-size: 11px; color: var(--accent); font-weight: 800; margin-top: 5px; text-transform: uppercase;"></div>
      </div>
    </aside>

    <div class="map-container"><div id="map"></div></div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script>
    // Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([22.9734, 78.6569], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    // --- FIX: INDIA-ONLY SEARCH ---
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Search Indian Areas...",
      collapsed: false,
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: { countrycodes: 'in', viewbox: '68,7,97,35', bounded: 1 }
      })
    }).on('markgeocode', function(e) {
      map.setView(e.geocode.center, 14);
      setPoint(e.geocode.center);
    }).addTo(map);

    function setPoint(latlng) {
      if (marker) map.removeLayer(marker);
      marker = L.marker(latlng).addTo(map);
      document.getElementById('lat').value = latlng.lat;
      document.getElementById('lng').value = latlng.lng;
    }
    map.on('click', e => setPoint(e.latlng));

    // Welcome Screen Delay
    window.addEventListener('load', () => {
      setTimeout(() => {
        const ws = document.getElementById('welcome-screen');
        ws.style.opacity = '0';
        setTimeout(() => ws.style.display = 'none', 800);
      }, 1500);
    });

    document.getElementById('priceForm').onsubmit = async (e) => {
      e.preventDefault();
      if (!document.getElementById('lat').value) { showToast("Please pin a location on the map!"); return; }
      
      const btn = document.getElementById('subBtn');
      btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> CALCULATING...';
      
      const fd = new FormData(e.target);
      const res = await fetch('/predict', { method: 'POST', body: fd });
      const data = await res.json();
      
      if (data.error) { showToast(data.error); } 
      else {
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('res-p').innerText = data.price;
        document.getElementById('res-city').innerText = data.city;
        document.getElementById('res-tier').innerText = data.tier_label;
      }
      btn.innerText = "RUN AI ANALYSIS";
    };

    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 5000); }
  </script>
</body>
</html>
