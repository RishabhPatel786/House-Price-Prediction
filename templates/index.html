<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bharat Estate AI | Professional Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #6366f1; --bg: #030712; --card: #0f172a; --text: #f8fafc; }
        body { margin:0; font-family:'Outfit', sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
        
        /* Glassmorphism Sidebar */
        .sidebar { width: 440px; background:var(--card); border-right: 1px solid #1e293b; padding:40px; display:flex; flex-direction:column; z-index:100; box-shadow: 20px 0 60px rgba(0,0,0,0.6); overflow-y:auto; }
        .logo { font-family:'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 35px; display:flex; align-items:center; gap:12px; }
        
        .search-container { background:#1e293b; border:1px solid #334155; border-radius:14px; display:flex; padding:6px; margin-bottom:30px; }
        #cityIn { background:transparent; border:none; color:white; padding:10px; flex:1; outline:none; }
        
        .field-label { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#64748b; font-weight:700; margin-bottom:8px; display:block; }
        input[type="number"], select { width:100%; padding:14px; margin-bottom:20px; border-radius:12px; border:1px solid #334155; background:#1e293b; color:white; box-sizing:border-box; outline:none; font-family:inherit; transition:0.3s; }
        input:focus { border-color:var(--accent); background:#161e31; }
        
        .predict-btn { width:100%; padding:18px; background:linear-gradient(135deg, var(--accent), #8b5cf6); border:none; border-radius:15px; color:white; font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:1px; margin-top:10px; transition:0.3s; }
        .predict-btn:hover { transform:translateY(-3px); box-shadow:0 15px 30px rgba(99,102,241,0.4); }

        #resultPanel { margin-top:35px; padding:25px; border-radius:20px; background:rgba(99,102,241,0.05); border:1px solid rgba(99,102,241,0.2); display:none; animation: slideIn 0.4s ease-out; }
        .price-val { font-size:42px; font-weight:800; color:#10b981; line-height:1; margin:10px 0; }
        #map { flex:1; z-index:1; }
        @keyframes slideIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-layer-group"></i> BHARAT ESTATE AI</div>
        
        <div class="search-container">
            <input type="text" id="cityIn" placeholder="Search City or Locality...">
            <button onclick="search()" style="background:var(--accent); border:none; color:white; width:45px; height:45px; border-radius:10px; cursor:pointer;"><i class="fas fa-search"></i></button>
        </div>

        <form id="priceForm">
            <span class="field-label">Area & Configuration</span>
            <input type="number" name="sqft" placeholder="Area in Sq Ft" value="1500">
            <div style="display:flex; gap:15px;">
                <div style="flex:1"><input type="number" name="beds" placeholder="BHK" value="3"></div>
                <div style="flex:1"><input type="number" name="baths" placeholder="Baths" value="2"></div>
            </div>

            <span class="field-label">Specifications</span>
            <select name="prop_type">
                <option value="0">Standard Apartment</option>
                <option value="1">Independent House</option>
                <option value="2">Luxury Villa</option>
            </select>
            <select name="furnish">
                <option value="0">Unfurnished</option>
                <option value="1">Semi-Furnished</option>
                <option value="2">Fully Furnished</option>
            </select>

            <input type="hidden" id="lat" name="lat">
            <input type="hidden" id="lng" name="lng">
            <button type="submit" class="predict-btn">Generate Valuation</button>
        </form>

        <div id="resultPanel">
            <div id="resCity" style="color:var(--accent); font-weight:700; font-size:14px;"></div>
            <div class="price-val" id="resPrice">--</div>
            <div id="resRate" style="color:#94a3b8; font-size:14px; margin-bottom:15px;"></div>
            <div id="resTag" style="display:inline-block; padding:6px 12px; background:rgba(245,158,11,0.1); color:#f59e0b; border-radius:8px; font-size:12px; font-weight:700;"></div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([23.18, 79.98], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        var marker;

        function search() {
            var q = document.getElementById('cityIn').value;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=in&limit=1`, { headers: {'User-Agent': 'ProEstateAI'} })
            .then(r => r.json()).then(d => { if(d.length > 0) { map.flyTo([d[0].lat, d[0].lon], 15); updateMarker(d[0].lat, d[0].lon); } });
        }

        function updateMarker(lat, lng) {
            if(marker) map.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable:true}).addTo(map);
            document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
        }

        map.on('click', function(e) { updateMarker(e.latlng.lat, e.latlng.lng); });

        document.getElementById('priceForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!document.getElementById('lat').value) return alert("📍 Mark a location on the map!");
            
            const btn = document.querySelector('.predict-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI Analyzing...';
            
            const res = await fetch('/predict', { method: 'POST', body: new FormData(e.target) });
            const data = await res.json();

            document.getElementById('resultPanel').style.display = 'block';
            document.getElementById('resPrice').innerText = data.price;
            document.getElementById('resCity').innerText = data.city;
            document.getElementById('resRate').innerText = "Est. Rate: " + data.rate;
            document.getElementById('resTag').innerText = data.loc_tag;
            btn.innerHTML = 'Generate Valuation';
        };
    </script>
</body>
</html>
