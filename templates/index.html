<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bharat Estate AI | Precision Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #6366f1; --bg: #030712; --card: #0f172a; }
        body { margin:0; font-family:'Outfit', sans-serif; background:var(--bg); color:white; display:flex; height:100vh; overflow:hidden; }
        
        /* Sidebar Scrollable */
        .sidebar { width: 480px; background:var(--card); border-right: 1px solid #1e293b; padding:35px; overflow-y:auto; z-index:100; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
        .header { font-size: 26px; font-weight: 900; color: var(--accent); margin-bottom: 30px; display:flex; align-items:center; gap:10px; }
        
        .section-header { font-size:11px; text-transform:uppercase; color:var(--accent); letter-spacing:2px; margin: 30px 0 15px; font-weight:900; display:block; border-bottom:1px solid #1e293b; padding-bottom:5px; }
        
        .input-grid { display:grid; grid-template-columns: 1fr 1fr; gap:15px; }
        input, select { width:100%; padding:12px; margin-bottom:12px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:white; box-sizing:border-box; outline:none; font-size:14px; }
        
        .checkbox-group { display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:12px; color:#94a3b8; margin-top:10px; }
        .btn-predict { width:100%; padding:18px; background:linear-gradient(135deg, var(--accent), #8b5cf6); border:none; border-radius:12px; color:white; font-weight:800; cursor:pointer; text-transform:uppercase; margin-top:25px; transition:0.3s; }
        .btn-predict:hover { transform:translateY(-3px); box-shadow:0 15px 30px rgba(99,102,241,0.4); }

        #map { flex-grow:1; z-index:1; }
        #result { margin-top:25px; padding:25px; background:rgba(99,102,241,0.1); border-radius:18px; border:1px solid var(--accent); display:none; animation:fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header"><i class="fas fa-microchip"></i> BHARAT ESTATE AI</div>
        
        <form id="proForm">
            <span class="section-header">Section 1 — Location</span>
            <input type="text" id="citySearch" placeholder="Search Locality or City...">
            <button type="button" onclick="search()" style="width:100%; padding:10px; background:#161e31; border:1px solid var(--accent); color:white; border-radius:10px; cursor:pointer; margin-bottom:15px;">Search on Map</button>

            <span class="section-header">Section 2 — Property</span>
            <div class="input-grid">
                <input type="number" name="sqft" placeholder="Area (Sq Ft)" value="1200">
                <select name="bhk"><option value="1">1 BHK</option><option value="2" selected>2 BHK</option><option value="3">3 BHK</option><option value="4">4+ BHK</option></select>
            </div>
            <div class="input-grid">
                <input type="number" name="age" placeholder="Age (Years)" value="5">
                <input type="number" name="floor" placeholder="Floor No" value="1">
            </div>
            <select name="type">
                <option value="0">Apartment</option>
                <option value="1">Independent House</option>
                <option value="2">Luxury Villa</option>
            </select>

            <span class="section-header">Section 3 — Accessibility</span>
            <div class="input-grid">
                <input type="number" step="0.1" name="dist_road" placeholder="Main Road (km)" value="0.5">
                <input type="number" step="0.1" name="dist_metro" placeholder="Metro (km)" value="5.0">
            </div>
            <input type="number" name="road_width" placeholder="Road Width (ft)" value="30">

            <span class="section-header">Section 4 — Amenities</span>
            <div class="checkbox-group">
                <label><input type="checkbox" name="amenities"> Pool/Gym</label>
                <label><input type="checkbox" name="gated"> Gated Society</label>
                <label><input type="checkbox" name="main_road_touch"> Main Road Touch</label>
                <label><input type="checkbox" name="lift"> Lift Available</label>
            </div>

            <input type="hidden" id="lat" name="lat"><input type="hidden" id="lng" name="lng">
            <button type="submit" class="btn-predict">Analyze Valuation</button>
        </form>

        <div id="result">
            <div id="resPrice" style="font-size:38px; font-weight:900; color:#10b981;"></div>
            <div id="resRate" style="font-size:14px; opacity:0.6; margin-top:5px;"></div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([23.18, 79.98], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        var marker;

        function search() {
            var q = document.getElementById('citySearch').value;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=in&limit=1`).then(r => r.json())
            .then(d => { if(d.length > 0) { map.flyTo([d[0].lat, d[0].lon], 15); placeMarker(d[0].lat, d[0].lon); } });
        }

        function placeMarker(lat, lng) {
            if(marker) map.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable:true}).addTo(map);
            document.getElementById('lat').value = lat; document.getElementById('lng').value = lng;
        }

        map.on('click', function(e) { placeMarker(e.latlng.lat, e.latlng.lng); });

        document.getElementById('proForm').onsubmit = async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('result');
            resDiv.style.display = "block";
            resDiv.innerHTML = "<div style='color:var(--accent); font-weight:700;'><i class='fas fa-spinner fa-spin'></i> AI analyzing 2026 market trends...</div>";
            
            const res = await fetch('/predict', { method: 'POST', body: new FormData(e.target) });
            const data = await res.json();
            document.getElementById('resPrice').innerText = data.price;
            document.getElementById('resRate').innerText = "Avg Rate: " + data.rate;
        };
    </script>
</body>
</html>
