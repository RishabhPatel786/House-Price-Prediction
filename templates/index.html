<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Estate AI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --bg: #030712; --glass: rgba(17, 24, 39, 0.8); --accent: #3b82f6; --green: #10b981; --text: #f9fafb; --border: rgba(255, 255, 255, 0.1); }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: rgba(3, 7, 18, 0.5); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); z-index: 100; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 420px; background: var(--glass); backdrop-filter: blur(30px); border-right: 1px solid var(--border); padding: 30px; overflow-y: auto; }
    input, select { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: white; margin-bottom: 20px; outline: none; }
    .btn-predict { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 14px; color: white; font-family: 'Syne'; font-weight: 800; cursor: pointer; }
    .map-container { flex: 1; position: relative; }
    #map { height: 100%; width: 100%; }
    #result-section { display: none; margin-top: 30px; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; border: 1px solid var(--green); }
    .leaflet-control-geocoder { background: #0e1525 !important; border: 1px solid var(--border) !important; color: white !important; width: 350px !important; border-radius: 10px !important; }
    .leaflet-control-geocoder-form input { color: white !important; }
  </style>
</head>
<body>

  <header>
    <div style="font-family: 'Syne'; font-weight: 800; font-size: 22px;">BHARAT ESTATE <span style="color: var(--accent);">AI</span></div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <form id="priceForm">
        <label style="font-size: 11px; color: #9ca3af;">TOTAL SQ.FT.</label>
        <input type="number" name="sqft" id="sqft" value="1200" required>
        <div style="display: flex; gap: 10px;">
          <input type="number" name="beds" placeholder="Beds" value="2" required>
          <input type="number" name="baths" placeholder="Baths" value="2" required>
        </div>
        <select name="prop_type">
          <option value="0">Apartment</option>
          <option value="1">Independent House</option>
          <option value="2">Luxury Villa</option>
        </select>
        <select name="furnish">
          <option value="0">Unfurnished</option>
          <option value="1">Semi-Furnished</option>
          <option value="2">Fully Furnished</option>
        </select>
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">
        <input type="hidden" name="manual_city" id="manual_city">
        
        <button type="submit" class="btn-predict" id="subBtn">RUN AI ANALYSIS</button>
      </form>

      <div id="result-section">
        <div id="res-p" style="font-size: 32px; font-weight: 800; color: var(--green); font-family: 'Syne';">₹0.00 L</div>
        <div id="res-city" style="font-size: 14px; font-weight: bold; margin-top: 5px;">---</div>
        <div id="res-tier" style="font-size: 11px; color: var(--accent); margin-top: 5px; text-transform: uppercase;"></div>
      </div>
    </aside>
    <div class="map-container"><div id="map"></div></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([22.9734, 78.6569], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    let marker;
    const geocoder = L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Search Locality (e.g. Vijay Nagar Jabalpur)",
      collapsed: false,
      geocoder: L.Control.Geocoder.nominatim({
        geocodingQueryParams: { countrycodes: 'in', addressdetails: 1, viewbox: '68,7,97,35', bounded: 1 }
      })
    }).on('markgeocode', function(e) {
      const latlng = e.geocode.center;
      const name = e.geocode.name; // This is the full string like "Vijay Nagar, Jabalpur..."
      
      map.setView(latlng, 15);
      if (marker) map.removeLayer(marker);
      marker = L.marker(latlng).addTo(map);
      
      document.getElementById('lat').value = latlng.lat;
      document.getElementById('lng').value = latlng.lng;
      // FIX: Force the manual city hidden input to take the exact search result
      document.getElementById('manual_city').value = name;
    }).addTo(map);

    map.on('click', e => {
      if (marker) map.removeLayer(marker);
      marker = L.marker(e.latlng).addTo(map);
      document.getElementById('lat').value = e.latlng.lat;
      document.getElementById('lng').value = e.latlng.lng;
      document.getElementById('manual_city').value = ""; // Reset if manually clicked
    });

    document.getElementById('priceForm').onsubmit = async (e) => {
      e.preventDefault();
      if (!document.getElementById('lat').value) return alert("Select a location!");
      const btn = document.getElementById('subBtn');
      btn.innerText = "CALCULATING...";
      const fd = new FormData(e.target);
      const res = await fetch('/predict', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.error) alert(data.error);
      else {
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('res-p').innerText = data.price;
        document.getElementById('res-city').innerText = data.city;
        document.getElementById('res-tier').innerText = data.tier_label;
      }
      btn.innerText = "RUN AI ANALYSIS";
    };
  </script>
</body>
</html>
